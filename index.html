<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Hóspede - Hotel Plaza</title>
    <style>
        /* Estilos para deixar a página bonita e centralizada */
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-cadastro {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            color: #4a5568;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3182ce;
        }

        .linha-dupla {
            display: flex;
            gap: 10px;
        }

        .linha-dupla div {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

    <div class="card-cadastro">
        <h2>🏨 Cadastro de Hóspede</h2>
        
        <form>
            <!-- Nome Completo -->
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>

            <!-- E-mail -->
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="maria@email.com" required>

            <!-- Telefone e CPF na mesma linha -->
            <div class="linha-dupla">
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                </div>
                <div>
                    <label for="cpf">CPF / Documento:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
            </div>

            <!-- Datas de Check-in e Check-out -->
            <div class="linha-dupla">
                <div>
                    <label for="checkin">Check-in:</label>
                    <input type="date" id="checkin" name="checkin" required>
                </div>
                <div>
                    <label for="checkout">Check-out:</label>
                    <input type="date" id="checkout" name="checkout" required>
                </div>
            </div>

            <!-- Tipo de Quarto -->
            <label for="quarto">Tipo de Quarto:</label>
            <select id="quarto" name="quarto">
                <option value="solteiro">Quarto Solteiro Standard</option>
                <option value="casal">Quarto Casal Standard</option>
                <option value="luxo">Suíte Luxo</option>
                <option value="familia">Suíte Família</option>
            </select>

            <!-- Botão Enviar -->
            <button type="submit">Finalizar Cadastro</button>
        </form>
    </div>

</body>
</html>
